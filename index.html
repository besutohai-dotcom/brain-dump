<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ブレインダンプ">
  <meta name="theme-color" content="#5856d6">
  <title>ブレインダンプ</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#f5f5f7;--surface:#fff;--border:#e5e5ea;
      --text:#1d1d1f;--muted:#8e8e93;
      --primary:#5856d6;--primary-h:#3634a3;
      --danger:#ff3b30;--success:#34c759;
      --radius:14px;--shadow:0 2px 12px rgba(0,0,0,.07);
    }
    @media(prefers-color-scheme:dark){
      :root{
        --bg:#1c1c1e;--surface:#2c2c2e;--border:#3a3a3c;
        --text:#f5f5f7;--muted:#8e8e93;
        --shadow:0 2px 12px rgba(0,0,0,.3);
      }
    }
    body{
      font-family:-apple-system,'Hiragino Sans','Hiragino Kaku Gothic ProN',
        'Noto Sans JP','Yu Gothic',sans-serif;
      background:var(--bg);color:var(--text);min-height:100vh;
      -webkit-font-smoothing:antialiased;
    }
    .app{
      max-width:780px;margin:0 auto;
      padding:calc(24px + env(safe-area-inset-top))
              calc(16px + env(safe-area-inset-right))
              calc(80px + env(safe-area-inset-bottom))
              calc(16px + env(safe-area-inset-left));
    }
    /* Header */
    .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
    .header-left{display:flex;align-items:baseline;gap:12px}
    .header h1{font-size:1.4rem;font-weight:700;letter-spacing:-.02em;color:var(--primary)}
    .stats{font-size:.8rem;color:var(--muted)}
    .header-right{display:flex;gap:8px}
    .btn-ghost{background:none;border:1px solid var(--border);border-radius:8px;
      padding:6px 12px;font-size:.82rem;font-family:inherit;cursor:pointer;
      color:var(--muted);transition:all .15s}
    .btn-ghost:hover{background:var(--border);color:var(--text)}
    .btn-ghost.danger:hover{background:#fff0ee;color:var(--danger);border-color:var(--danger)}
    .btn-ghost.lang-btn{font-weight:600;letter-spacing:.03em;color:var(--primary);border-color:var(--primary);padding:6px 10px}
    .btn-ghost.lang-btn:hover{background:var(--primary);color:#fff}
    /* Export dropdown */
    .export-wrap{position:relative}
    .export-menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);
      border:1px solid var(--border);border-radius:10px;padding:4px;
      box-shadow:0 8px 24px rgba(0,0,0,.15);z-index:100;min-width:180px;white-space:nowrap}
    .export-item{display:block;width:100%;padding:9px 14px;border:none;background:none;
      font-family:inherit;font-size:.85rem;color:var(--text);text-align:left;
      cursor:pointer;border-radius:7px;transition:background .12s}
    .export-item:hover{background:var(--border)}
    /* Settings */
    .settings-panel{background:var(--surface);border:1px solid var(--border);
      border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
    .settings-panel h3{font-size:.95rem;margin-bottom:8px}
    .settings-intro{font-size:.85rem;color:var(--muted);line-height:1.6;margin-bottom:12px}
    .settings-intro a{color:var(--primary)}
    .row{display:flex;gap:8px;margin-bottom:8px}
    .input{flex:1;padding:10px 12px;border:1px solid var(--border);border-radius:8px;
      font-size:.9rem;font-family:inherit;outline:none;transition:border-color .15s;
      background:var(--surface);color:var(--text)}
    .input:focus{border-color:var(--primary)}
    .input.mono{font-family:'SF Mono',Menlo,monospace;font-size:.85rem}
    .hint{font-size:.78rem;color:var(--muted);line-height:1.5}
    /* Input card */
    .input-card{background:var(--surface);border:1px solid var(--border);
      border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
    .textarea-wrap{position:relative}
    .main-textarea{width:100%;min-height:96px;padding:10px 44px 10px 12px;
      border:1px solid var(--border);border-radius:10px;font-size:.95rem;
      font-family:inherit;line-height:1.65;resize:vertical;outline:none;
      transition:border-color .15s;background:var(--surface);color:var(--text)}
    .main-textarea:focus{border-color:var(--primary)}
    .main-textarea:disabled{opacity:.6}
    .input-footer{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
    /* Buttons */
    .btn-primary{background:var(--primary);color:#fff;border:none;border-radius:8px;
      padding:9px 18px;font-size:.88rem;font-family:inherit;font-weight:500;
      cursor:pointer;transition:background .15s;display:inline-flex;align-items:center;gap:6px}
    .btn-primary:hover:not(:disabled){background:var(--primary-h)}
    .btn-primary:disabled{opacity:.55;cursor:not-allowed}
    .btn-secondary{background:var(--surface);color:var(--primary);
      border:1.5px solid var(--primary);border-radius:8px;padding:9px 16px;
      font-size:.88rem;font-family:inherit;font-weight:500;cursor:pointer;
      transition:all .15s;white-space:nowrap}
    .btn-secondary:hover:not(:disabled){background:var(--primary);color:#fff}
    .btn-secondary:disabled{opacity:.5;cursor:not-allowed}
    /* Mic button */
    .mic-btn{position:absolute;right:8px;bottom:8px;width:30px;height:30px;
      border-radius:50%;border:none;background:none;cursor:pointer;
      font-size:1.1rem;display:flex;align-items:center;justify-content:center;
      color:var(--muted);transition:all .15s;flex-shrink:0}
    .mic-btn:hover{background:var(--border)}
    .mic-btn.recording{color:var(--danger);animation:pulse 1s ease-in-out infinite}
    .mic-btn-inline{width:32px;height:32px;border-radius:50%;border:none;background:none;
      cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;
      color:var(--muted);transition:all .15s;flex-shrink:0}
    .mic-btn-inline:hover{background:var(--border)}
    .mic-btn-inline.recording{color:var(--danger);animation:pulse 1s ease-in-out infinite}
    @keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.2);opacity:.7}}
    .voice-status{font-size:.75rem;color:var(--danger);margin-top:4px;min-height:1em}
    /* Spinner */
    .spin{display:inline-block;width:12px;height:12px;border:2px solid currentColor;
      border-top-color:transparent;border-radius:50%;
      animation:spin .6s linear infinite;vertical-align:middle}
    @keyframes spin{to{transform:rotate(360deg)}}
    /* Error */
    .error-banner{background:#fff5f5;border:1px solid #ffd5d5;color:var(--danger);
      border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:.88rem}
    @media(prefers-color-scheme:dark){
      .error-banner{background:#3a1a1a;border-color:#7a3a3a}
    }
    /* Toast (undo) */
    .toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));left:50%;
      transform:translateX(-50%);background:#1d1d1f;color:#fff;border-radius:10px;
      padding:10px 16px;font-size:.88rem;display:flex;align-items:center;gap:12px;
      box-shadow:0 4px 20px rgba(0,0,0,.25);z-index:999;
      animation:slideUp .2s ease}
    @keyframes slideUp{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
    .toast-undo{background:none;border:none;color:#a78bfa;font-size:.88rem;
      font-family:inherit;font-weight:600;cursor:pointer;padding:0}
    /* Query bar */
    .query-bar{display:flex;align-items:center;gap:6px;background:var(--surface);
      border:1px solid var(--border);border-radius:10px;padding:6px 8px 6px 14px;
      margin-bottom:12px;box-shadow:var(--shadow)}
    .query-icon{font-size:1rem;flex-shrink:0}
    .query-input{flex:1;border:none;outline:none;font-size:.88rem;
      font-family:inherit;background:transparent;color:var(--text)}
    .query-input::placeholder{color:var(--muted)}
    /* Query result */
    .query-result{background:#f3f4ff;border:1px solid #c9cbf5;
      border-radius:var(--radius);padding:16px;margin-bottom:16px}
    @media(prefers-color-scheme:dark){
      .query-result{background:#1e1e3a;border-color:#3a3a7a}
    }
    .qr-header{display:flex;justify-content:space-between;align-items:center;
      margin-bottom:10px;font-size:.88rem}
    .close-btn{background:none;border:none;cursor:pointer;color:var(--muted);
      font-size:1rem;padding:2px 6px;border-radius:4px}
    .close-btn:hover{background:rgba(128,128,128,.15)}
    .qr-body p{font-size:.9rem;line-height:1.75;color:var(--text)}
    .qr-body p:empty{display:none}
    /* Search bar */
    .search-bar{display:flex;align-items:center;gap:6px;background:var(--surface);
      border:1px solid var(--border);border-radius:10px;padding:6px 10px;
      margin-bottom:12px;box-shadow:var(--shadow)}
    .search-icon{font-size:.9rem;flex-shrink:0;color:var(--muted)}
    .search-input{flex:1;border:none;outline:none;font-size:.88rem;
      font-family:inherit;background:transparent;color:var(--text)}
    .search-input::placeholder{color:var(--muted)}
    .search-clear{background:none;border:none;cursor:pointer;color:var(--muted);
      font-size:.8rem;padding:2px 5px;border-radius:4px;line-height:1}
    .search-clear:hover{background:var(--border);color:var(--text)}
    /* Filter */
    .filter-bar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
    .chip{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;
      border-radius:20px;border:1px solid var(--border);background:var(--surface);
      font-size:.82rem;font-family:inherit;cursor:pointer;color:var(--muted);transition:all .15s}
    .chip-active{font-weight:500}
    .count{background:rgba(128,128,128,.15);border-radius:10px;padding:0 6px;font-size:.75rem}
    .chip-active .count{background:rgba(255,255,255,.25)}
    /* Task list */
    .task-list{display:flex;flex-direction:column;gap:10px}
    .empty-state{text-align:center;padding:60px 20px;color:var(--muted);
      font-size:1rem;line-height:2.2}
    .empty-state small{font-size:.85rem}
    /* Swipe wrapper */
    .swipe-wrap{position:relative;overflow:hidden;border-radius:var(--radius);
      border:1px solid var(--border);box-shadow:var(--shadow);transition:box-shadow .15s}
    .swipe-wrap:hover{box-shadow:0 4px 20px rgba(0,0,0,.11)}
    .swipe-bg{position:absolute;top:0;bottom:0;width:64px;display:flex;
      align-items:center;justify-content:center;font-size:1.3rem;font-weight:700;pointer-events:none}
    .swipe-bg-complete{left:0;background:var(--success);color:#fff}
    .swipe-bg-delete{right:0;background:var(--danger);color:#fff}
    /* Task card */
    .task-card{background:var(--surface);padding:16px;transition:opacity .2s;position:relative}
    .task-done{opacity:.55}
    .task-done .task-title{text-decoration:line-through;color:var(--muted)}
    .task-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
    .task-labels{display:flex;align-items:center;gap:8px}
    .tag{font-size:.75rem;font-weight:600;padding:3px 9px;border-radius:20px;border:1px solid}
    .task-date{font-size:.75rem;color:var(--muted)}
    .task-btns{display:flex;gap:4px}
    .icon-btn{width:30px;height:30px;border-radius:7px;border:1px solid var(--border);
      background:none;cursor:pointer;font-size:.88rem;color:var(--muted);
      display:flex;align-items:center;justify-content:center;transition:all .15s}
    .icon-btn:hover{background:var(--border);color:var(--text)}
    .icon-done{color:var(--success);border-color:var(--success)}
    .icon-done:hover{background:#e8faf0}
    .icon-del:hover{background:#fff0ee;color:var(--danger);border-color:var(--danger)}
    /* Edit mode */
    .edit-field{width:100%;padding:7px 10px;border:1px solid var(--primary);border-radius:8px;
      font-family:inherit;font-size:.95rem;font-weight:600;outline:none;
      background:var(--surface);color:var(--text);margin-bottom:6px}
    .edit-original{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:8px;
      font-family:inherit;font-size:.855rem;outline:none;resize:vertical;min-height:60px;
      background:var(--surface);color:var(--text);margin-bottom:8px;line-height:1.5}
    .edit-original:focus{border-color:var(--primary)}
    .edit-actions{display:flex;gap:6px;margin-bottom:10px}
    .btn-save{background:var(--primary);color:#fff;border:none;border-radius:7px;
      padding:6px 14px;font-size:.83rem;font-family:inherit;font-weight:500;cursor:pointer}
    .btn-cancel{background:none;border:1px solid var(--border);border-radius:7px;
      padding:6px 12px;font-size:.83rem;font-family:inherit;color:var(--muted);cursor:pointer}
    .task-title{font-size:1rem;font-weight:600;line-height:1.45;
      margin-bottom:5px;letter-spacing:-.01em}
    .task-original{font-size:.855rem;color:var(--muted);line-height:1.65;margin-bottom:12px}
    /* Next actions */
    .actions-box{background:#f9f9ff;border-left:3px solid var(--primary);
      border-radius:0 8px 8px 0;padding:12px 14px;margin-bottom:10px}
    @media(prefers-color-scheme:dark){.actions-box{background:#1e1e3a}}
    .actions-label{font-size:.8rem;font-weight:600;margin-bottom:8px;color:var(--primary)}
    .actions-list{padding-left:18px;display:flex;flex-direction:column;gap:4px}
    .actions-list li{font-size:.855rem;line-height:1.55;color:var(--text)}
    /* Suggest btn */
    .suggest-btn{width:100%;padding:8px;background:none;border:1px dashed var(--border);
      border-radius:8px;font-size:.83rem;font-family:inherit;color:var(--muted);
      cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;
      justify-content:center;gap:6px}
    .suggest-btn:hover:not(:disabled){border-color:var(--primary);color:var(--primary);background:#f3f4ff}
    .suggest-btn:disabled{cursor:not-allowed}
    .no-voice{font-size:.75rem;color:var(--muted);margin-top:4px}
    /* Task notes */
    .notes-section{margin-bottom:10px}
    .notes-textarea{width:100%;padding:8px 10px;border:1px solid var(--border);
      border-radius:8px;font-family:inherit;font-size:.855rem;outline:none;
      resize:vertical;min-height:72px;background:var(--surface);color:var(--text);
      line-height:1.55;transition:border-color .15s}
    .notes-textarea:focus{border-color:var(--primary)}
    .icon-note.has-note{color:#ff9500!important;border-color:#ff950055!important;background:#ff950018!important}
    /* Markdown notes preview */
    .notes-mode-toggle{display:flex;gap:4px;margin-bottom:6px}
    .notes-mode-btn{padding:3px 10px;font-size:.78rem;border:1px solid var(--border);border-radius:6px;
      background:var(--surface);color:var(--muted);cursor:pointer;transition:all .15s}
    .notes-mode-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
    .notes-preview{padding:8px 10px;border:1px solid var(--border);border-radius:8px;
      background:var(--surface);min-height:48px;font-size:.855rem;line-height:1.6;color:var(--text)}
    .notes-preview p{margin:.3em 0}
    .notes-preview ul,.notes-preview ol{margin:.3em 0 .3em 1.4em}
    .notes-preview li{margin:.15em 0}
    .notes-preview li.task-list-item{list-style:none;margin-left:-1.1em}
    .notes-preview li.task-list-item input[type=checkbox]{margin-right:5px;accent-color:var(--primary);pointer-events:none}
    .notes-preview strong{font-weight:600}
    .notes-preview em{font-style:italic}
    .notes-preview code{font-family:monospace;font-size:.85em;background:var(--border);padding:1px 4px;border-radius:3px}
    .notes-preview h1,.notes-preview h2,.notes-preview h3{font-size:1em;font-weight:600;margin:.4em 0 .2em}
    .notes-preview blockquote{border-left:3px solid var(--primary);margin:.3em 0;padding-left:.8em;color:var(--muted)}
    .notes-preview a{color:var(--primary)}
    .notes-preview-empty{color:var(--muted);font-size:.85rem;font-style:italic}
    /* Batch select */
    .batch-bar{position:fixed;bottom:0;left:0;right:0;background:var(--surface);
      border-top:1px solid var(--border);z-index:200;
      padding:10px 16px calc(10px + env(safe-area-inset-bottom));
      display:flex;align-items:center;gap:8px;flex-wrap:wrap;
      box-shadow:0 -4px 16px rgba(0,0,0,.1)}
    .batch-count{flex:1;font-size:.88rem;font-weight:500;color:var(--text);min-width:80px}
    .task-checkbox{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);
      flex-shrink:0;display:flex;align-items:center;justify-content:center;
      cursor:pointer;transition:all .15s;background:var(--surface);
      font-size:.75rem;line-height:1;margin-right:2px}
    .task-checkbox.checked{background:var(--primary);border-color:var(--primary);color:#fff}
    /* Due date badge */
    .due-badge{font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:10px;
      border:1px solid;letter-spacing:.01em;display:inline-flex;align-items:center;gap:3px}
    .due-overdue{color:var(--danger);border-color:#ff3b3055;background:#ff3b3018}
    .due-today{color:#ff9500;border-color:#ff950055;background:#ff950018}
    .due-future{color:var(--muted);border-color:var(--border);background:transparent}
    /* Due date input in edit mode */
    .edit-date-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
    .edit-date-label{font-size:.82rem;color:var(--muted);white-space:nowrap}
    .edit-date{padding:6px 10px;border:1px solid var(--border);border-radius:8px;
      font-family:inherit;font-size:.85rem;outline:none;background:var(--surface);
      color:var(--text);cursor:pointer}
    .edit-date:focus{border-color:var(--primary)}
    .btn-clear-date{background:none;border:none;cursor:pointer;color:var(--muted);
      font-size:.78rem;padding:2px 4px;border-radius:4px}
    .btn-clear-date:hover{color:var(--danger)}
    /* Priority badge */
    .priority-badge{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:10px;
      border:1px solid;cursor:pointer;transition:opacity .15s;letter-spacing:.02em;
      background:none;font-family:inherit;line-height:1.4}
    .priority-badge:hover{opacity:.65}
    @media(max-width:500px){
      .app{padding:16px 12px 60px}
      .header h1{font-size:1.2rem}
      .main-textarea{min-height:80px}
    }
    /* Onboarding */
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    .onboarding-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);
      display:flex;align-items:center;justify-content:center;z-index:300;padding:16px;
      animation:fadeIn .2s ease}
    .onboarding-card{background:var(--surface);border-radius:20px;padding:32px 28px;
      max-width:420px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);text-align:center;
      animation:slideUp .25s ease;position:relative}
    .onboarding-lang{position:absolute;top:14px;right:14px;background:none;
      border:1px solid var(--border);border-radius:7px;padding:4px 10px;
      font-size:.78rem;font-weight:600;color:var(--primary);border-color:var(--primary);
      cursor:pointer;font-family:inherit}
    .onboarding-lang:hover{background:var(--primary);color:#fff}
    .onboarding-icon{font-size:3rem;margin-bottom:12px}
    .onboarding-title{font-size:1.4rem;font-weight:700;margin-bottom:10px;color:var(--primary)}
    .onboarding-desc{font-size:.9rem;color:var(--muted);line-height:1.65;margin-bottom:24px}
    .onboarding-steps{text-align:left;display:flex;flex-direction:column;gap:14px;margin-bottom:28px}
    .onboarding-step{display:flex;align-items:flex-start;gap:12px}
    .onboarding-step-num{width:26px;height:26px;border-radius:50%;background:var(--primary);
      color:#fff;font-size:.82rem;font-weight:700;display:flex;align-items:center;
      justify-content:center;flex-shrink:0;margin-top:1px}
    .onboarding-step strong{font-size:.9rem;display:block;margin-bottom:2px}
    .onboarding-step p{font-size:.82rem;color:var(--muted);line-height:1.5;margin:0}
    .onboarding-btn{width:100%;justify-content:center;padding:12px;font-size:.95rem;margin-bottom:10px}
    .onboarding-skip{background:none;border:none;font-size:.82rem;color:var(--muted);
      cursor:pointer;font-family:inherit;padding:4px 8px;border-radius:6px}
    .onboarding-skip:hover{color:var(--text);background:var(--border)}
    /* Statistics view */
    .stats-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);
      display:flex;align-items:flex-end;justify-content:center;z-index:200;padding:0}
    .stats-sheet{background:var(--surface);border-radius:20px 20px 0 0;
      max-width:780px;width:100%;max-height:90vh;overflow-y:auto;
      padding:24px 20px calc(24px + env(safe-area-inset-bottom));
      animation:slideUp .25s ease}
    .stats-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
    .stats-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:24px}
    .stat-card{background:var(--bg);border-radius:12px;padding:12px 8px;text-align:center}
    .stat-num{font-size:1.5rem;font-weight:700}
    .stat-label{font-size:.7rem;color:var(--muted);margin-top:3px}
    .chart-section{margin-bottom:22px}
    .chart-title{font-size:.88rem;font-weight:600;margin-bottom:10px}
    .bar-chart{display:flex;flex-direction:column;gap:5px}
    .bar-row{display:flex;align-items:center;gap:8px}
    .bar-label{font-size:.72rem;color:var(--muted);width:44px;text-align:right;flex-shrink:0}
    .bar-track{flex:1;background:var(--border);border-radius:4px;height:16px;overflow:hidden}

// ─── Speech Recognition ───────────────────────────────────────────
const SR = window.SpeechRecognition || window.webkitSpeechRecognition
const IS_PWA = window.navigator.standalone === true
const VOICE_OK = !!SR && !IS_PWA

function useSpeech(onResult, lang) {
  const [listening, setListening] = useState(false)
  const recRef = useRef(null)
  const start = useCallback(() => {
    if (!VOICE_OK) return
    const rec = new SR()
    rec.lang = lang === 'en' ? 'en-US' : 'ja-JP'
    rec.interimResults = false; rec.maxAlternatives = 1
    rec.onresult = e => onResult(e.results[0][0].transcript)
    rec.onend = () => setListening(false)
    rec.onerror = () => setListening(false)
    rec.start(); recRef.current = rec; setListening(true)
  }, [onResult, lang])
  const stop = useCallback(() => { recRef.current?.stop(); setListening(false) }, [])
  const toggle = useCallback(() => listening ? stop() : start(), [listening, start, stop])
  return { listening, toggle, supported: VOICE_OK }
}

// ─── Claude API ───────────────────────────────────────────────────
async function callClaude(apiKey, prompt, maxTokens = 512) {
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
    },
    body: JSON.stringify({
      model: 'claude-haiku-4-5',
      max_tokens: maxTokens,
      messages: [{ role: 'user', content: prompt }],
    }),
  })
  if (!res.ok) {
    const err = await res.json().catch(() => ({}))
    throw new Error(err?.error?.message || `API error: ${res.status}`)
  }
  return (await res.json()).content[0]?.text ?? ''
}

async function categorizeTask(apiKey, text, existingCategories, lang) {
  if (lang === 'en') {
    const catStr = existingCategories.length ? `Existing categories: ${existingCategories.join(', ')}` : 'Existing categories: none'
    const raw = await callClaude(apiKey,
      `${catStr}\n\nInput text: "${text}"\n\nUse an existing category if suitable, otherwise create a new one (Work/Health/Learning/Family/Hobbies/Shopping/Self-improvement/Relationships etc.).\n\nReturn JSON only: {"title":"concise title","category":"category name"}`, 200)
    const m = raw.match(/\{[^{}]*\}/)
    if (!m) throw new Error('Categorization failed')
    return JSON.parse(m[0])
  }
  const catStr = existingCategories.length ? `既存カテゴリ: ${existingCategories.join('、')}` : '既存カテゴリ: なし'
  const raw = await callClaude(apiKey,
    `${catStr}\n\n入力テキスト: "${text}"\n\n既存カテゴリに合うものがあればそれを使用。なければ新規作成（仕事/健康/学習/家族/趣味/買い物/自己啓発/人間関係 など）。\n\nJSONのみ返してください：{"title":"簡潔なタイトル","category":"カテゴリ名"}`, 200)
  const m = raw.match(/\{[^{}]*\}/)
  if (!m) throw new Error('分類に失敗しました')
  return JSON.parse(m[0])
}

async function getNextActions(apiKey, task, lang) {
  if (lang === 'en') {
    const raw = await callClaude(apiKey,
      `Task "${task.title}" (${task.category}): suggest 3-5 concrete next actions.\nOriginal note: "${task.originalText}"\nReturn a JSON array only: ["action1","action2","action3"]`, 512)
    const m = raw.match(/\[[\s\S]*?\]/)
    if (!m) throw new Error('Failed to get suggestions')
    return JSON.parse(m[0])
  }
  const raw = await callClaude(apiKey,
    `タスク「${task.title}」（${task.category}）の具体的な次のアクションを3〜5個提案してください。\n元のメモ: "${task.originalText}"\nJSON配列のみ：["アクション1","アクション2","アクション3"]`, 512)
  const m = raw.match(/\[[\s\S]*?\]/)
  if (!m) throw new Error('提案の取得に失敗しました')
  return JSON.parse(m[0])
}

async function queryTasks(apiKey, query, tasks, lang) {
  if (lang === 'en') {
    const summary = tasks.length === 0 ? 'No tasks'
      : tasks.map(t => `[${t.category}] ${t.title} (${t.status === 'done' ? 'done' : 'active'}): ${t.originalText}`).join('\n')
    return callClaude(apiKey, `Task list:\n${summary}\n\nQuestion: ${query}\n\nAnswer concisely in English.`, 1024)
  }
  const summary = tasks.length === 0 ? 'タスクはありません'
    : tasks.map(t => `[${t.category}] ${t.title}（${t.status === 'done' ? '完了' : '未完了'}）: ${t.originalText}`).join('\n')
  return callClaude(apiKey, `タスクリスト:\n${summary}\n\n質問: ${query}\n\n日本語で具体的・簡潔に答えてください。`, 1024)
}

async function generateWeeklySummary(apiKey, tasks, lang) {
  const now = new Date()
  const weekAgo = new Date(now)
  weekAgo.setDate(weekAgo.getDate() - 7)
  const weekAgoStr = weekAgo.toISOString().slice(0, 10)
  const done = tasks.filter(t => t.completedAt && t.completedAt.slice(0, 10) >= weekAgoStr)
  if (done.length === 0) return ''
  if (lang === 'en') {
    const list = done.map(t => `- [${t.category}] ${t.title}${t.priority === 'high' ? ' (high priority)' : ''}`).join('\n')
    return callClaude(apiKey,
      `You are a supportive productivity coach. The user completed these ${done.length} tasks in the last 7 days:\n${list}\n\nWrite a warm, encouraging weekly review in 3-5 short paragraphs covering:\n1. What was accomplished (main themes and highlights)\n2. Any notable patterns or wins\n3. One or two actionable suggestions for next week\n\nBe specific, concise, and motivating.`, 1024)
  }
  const list = done.map(t => `- [${t.category}] ${t.title}${t.priority === 'high' ? '（高優先度）' : ''}`).join('\n')
  return callClaude(apiKey,
    `あなたはサポート力のある生産性コーチです。ユーザーが先週（7日以内）に完了した${done.length}件のタスクは以下の通りです：\n${list}\n\n次の内容を含む温かく励みになる週間レビューを3〜5段落で書いてください：\n1. 達成した内容（主なテーマとハイライト）\n2. 目立ったパターンや成果\n3. 来週に向けた1〜2つの具体的な提案\n\n具体的、簡潔、前向きな文体でお願いします。`, 1024)
}

// ─── Audio ────────────────────────────────────────────────────────
function playBeep(freq = 880, dur = 0.35) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)()
    const osc = ctx.createOscillator()
    const gain = ctx.createGain()
    osc.connect(gain); gain.connect(ctx.destination)
    osc.type = 'sine'; osc.frequency.value = freq
    gain.gain.setValueAtTime(0.28, ctx.currentTime)
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur)
    osc.start(ctx.currentTime); osc.stop(ctx.currentTime + dur)
  } catch {}
}

// ─── Storage ──────────────────────────────────────────────────────
const KEY = 'brain-dump-v1'
const DEFAULTS = {tasks:[],categories:[],apiKey:'',lang:'ja',onboarded:false,notificationsEnabled:false,boards:[],activeBoardId:null,boardData:{},taskOrder:[],journal:{}}
const load = () => {
  try {
    const raw = { ...DEFAULTS, ...JSON.parse(localStorage.getItem(KEY) || 'null') }
    if (!raw.boards || raw.boards.length === 0) {
      const did = 'default'
      raw.boards = [{ id: did, name: 'メイン' }]
      raw.activeBoardId = did
      raw.boardData = { [did]: { tasks: raw.tasks || [], categories: raw.categories || [] } }

}

const formatDate = (isoDate, locale) => new Date(isoDate + 'T00:00:00').toLocaleDateString(locale, { month: 'numeric', day: 'numeric' })

const getDueDateInfo = (dueDate, T) => {
  if (!dueDate) return null
  const today = new Date().toISOString().slice(0, 10)
  if (dueDate < today) return { cls: 'due-overdue', label: `⚠️ ${formatDate(dueDate, T.locale)}` }
  if (dueDate === today) return { cls: 'due-today', label: `${T.today} ${formatDate(dueDate, T.locale)}` }
  return { cls: 'due-future', label: `📅 ${formatDate(dueDate, T.locale)}` }
}

// ─── Notifications ────────────────────────────────────────────────
const NOTIF_STORE = 'brain-dump-notified-v1'

function loadNotifiedSet() {
  try {
    const raw = localStorage.getItem(NOTIF_STORE)
    if (!raw) return {}
    const obj = JSON.parse(raw)
    const cutoff = new Date(Date.now() - 2 * 86400000).toISOString().slice(0, 10)
    const out = {}
    Object.keys(obj).forEach(k => {
      const parts = k.split(':')
      if (parts.length === 2 && parts[1] >= cutoff) out[k] = true
    })
    return out
  } catch { return {} }
}

function saveNotifiedSet(obj) {
  try { localStorage.setItem(NOTIF_STORE, JSON.stringify(obj)) } catch {}
}

function checkAndNotify(tasks, T) {
  if (!('Notification' in window) || Notification.permission !== 'granted') return
  const today = new Date().toISOString().slice(0, 10)
  const notified = loadNotifiedSet()
  let changed = false
  for (const task of tasks) {
    if (task.status === 'done' || !task.dueDate) continue
    if (task.dueDate > today) continue
    const key = `${task.id}:${today}`
    if (notified[key]) continue
    const isOverdue = task.dueDate < today
    const title = T.notifTaskTitle(task)
    const body = isOverdue ? T.notifOverdueBody(task) : T.notifTaskBody(task)
    try { new Notification(title, { body, tag: task.id }) } catch {}
    notified[key] = true
    changed = true
  }
  if (changed) saveNotifiedSet(notified)
}

// ─── SwipeCard ────────────────────────────────────────────────────
function SwipeCard({ children, isDone, disabled, onComplete, onDelete, draggable: isDraggable, dragClass, onDragStart, onDragOver, onDrop, onDragEnd }) {
  const [dx, setDx] = useState(0)
  const s = useRef({ startX:0, startY:0, axis:null, dx:0, active:false })
  const wrapRef = useRef(null)
  const THRESHOLD = 72

  useEffect(() => {
    const el = wrapRef.current
    if (!el) return
    const onMove = e => {
      const st = s.current
      if (!st.active) return
      const diffX = e.touches[0].clientX - st.startX
      const diffY = e.touches[0].clientY - st.startY
      if (!st.axis) st.axis = Math.abs(diffX) > Math.abs(diffY) ? 'h' : 'v'
      if (st.axis === 'h') {
        e.preventDefault()
        st.dx = diffX
        setDx(diffX)
      }
    }
    el.addEventListener('touchmove', onMove, { passive: false })
    return () => el.removeEventListener('touchmove', onMove)
  }, [])

  const onTouchStart = e => {
    const st = s.current
    if (disabled) { st.active = false; return }
    st.active = true
    st.startX = e.touches[0].clientX
    st.startY = e.touches[0].clientY
    st.axis = null
    st.dx = 0
  }

  const onTouchEnd = () => {
    const d = s.current.dx
    if (d > THRESHOLD) onComplete?.()
    else if (d < -THRESHOLD) onDelete?.()
    setDx(0)
    s.current.dx = 0
    s.current.axis = null
    s.current.active = false
  }

  const progress = Math.min(Math.abs(dx) / THRESHOLD, 1)

  return h('div', { ref: wrapRef, class: `swipe-wrap${dragClass ? ' ' + dragClass : ''}`, onTouchStart, onTouchEnd,
    draggable: isDraggable || false, onDragStart, onDragOver, onDrop, onDragEnd },
    h('div', { class: 'swipe-bg swipe-bg-complete', style: `opacity:${dx > 0 ? progress : 0}` }, '✓'),
    h('div', { class: 'swipe-bg swipe-bg-delete', style: `opacity:${dx < 0 ? progress : 0}` }, '✕'),
    h('div', {
      class: `task-card${isDone ? ' task-done' : ''}`,
      style: dx !== 0
        ? `transform:translateX(${dx}px);transition:none`
        : 'transform:translateX(0);transition:transform .25s ease',
    }, children)
  )
}

// ─── StatsView ────────────────────────────────────────────────
function StatsView({ data, T, onClose }) {
  const tasks = data.tasks
  const cats = data.categories
  const totalTasks = tasks.length
  const activeTasks = tasks.filter(t => t.status === 'active').length
  const doneTasks = tasks.filter(t => t.status === 'done').length
  const catCount = cats.length
  const completionRate = totalTasks > 0 ? Math.round(doneTasks / totalTasks * 100) : 0

  const today = new Date()
  const days = Array.from({ length: 7 }, (_, i) => {
    const d = new Date(today)
    d.setDate(d.getDate() - (6 - i))
    return d.toISOString().slice(0, 10)
  })
  const completionsByDay = days.map(day => ({
    day,
    count: tasks.filter(t => t.completedAt && t.completedAt.slice(0, 10) === day).length,
  }))
  const maxDay = Math.max(...completionsByDay.map(d => d.count), 1)

  const catData = cats.map(cat => {
    const catTasks = tasks.filter(t => t.category === cat)
    return { cat, total: catTasks.length, done: catTasks.filter(t => t.status === 'done').length, color: catColor(cat, cats) }
  }).sort((a, b) => b.total - a.total)
  const maxCat = Math.max(...catData.map(c => c.total), 1)

  return h('div', {
    class: 'stats-overlay',
    onClick: e => { if (e.target === e.currentTarget) onClose() },
  },
    h('div', { class: 'stats-sheet' },
      h('div', { class: 'stats-header' },
        h('h2', { style: 'font-size:1.15rem;font-weight:700' }, T.statsTitle),
        h('button', { class: 'close-btn', onClick: onClose, style: 'font-size:1.2rem;padding:4px 8px' }, '✕')
      ),
      h('div', { class: 'stats-summary' },
        h('div', { class: 'stat-card' },
          h('div', { class: 'stat-num', style: 'color:var(--text)' }, totalTasks),
          h('div', { class: 'stat-label' }, T.statsTotalTasks)
        ),
        h('div', { class: 'stat-card' },
          h('div', { class: 'stat-num', style: 'color:#ff9500' }, activeTasks),
          h('div', { class: 'stat-label' }, T.statsActive)
        ),
        h('div', { class: 'stat-card' },
          h('div', { class: 'stat-num', style: 'color:var(--success)' }, doneTasks),
          h('div', { class: 'stat-label' }, T.statsDone)
        ),
        h('div', { class: 'stat-card' },
          h('div', { class: 'stat-num', style: 'color:var(--primary)' }, catCount),
          h('div', { class: 'stat-label' }, T.statsCategories)
        ),
      ),
      totalTasks > 0 && h('div', { class: 'chart-section' },
        h('div', { class: 'chart-title' }, `${T.statsCompletionRate} — ${completionRate}%`),
        h('div', { class: 'bar-track', style: 'height:20px;border-radius:8px' },
          h('div', { class: 'bar-fill', style: `width:${completionRate}%;background:var(--success)` })
        )
      ),
      h('div', { class: 'chart-section' },
        h('div', { class: 'chart-title' }, T.statsDailyTitle),
        completionsByDay.every(d => d.count === 0)
          ? h('p', { style: 'font-size:.85rem;color:var(--muted);padding:8px 0' }, T.statsNoData)
          : h('div', { class: 'bar-chart' },
              completionsByDay.map(({ day, count }) => {
                const label = new Date(day + 'T12:00:00').toLocaleDateString(T.locale, { month: 'numeric', day: 'numeric' })
                return h('div', { key: day, class: 'bar-row' },
                  h('span', { class: 'bar-label' }, label),
                  h('div', { class: 'bar-track' },
                    h('div', { class: 'bar-fill', style: `width:${count / maxDay * 100}%;background:var(--primary)` })
                  ),
                  h('span', { class: 'bar-count' }, count > 0 ? count : '')
                )
              })
            )
      ),
      catData.length > 0 && h('div', { class: 'chart-section' },
        h('div', { class: 'chart-title' }, T.statsCategoryTitle),
        catData.map(({ cat, total, done, color }) =>
          h('div', { key: cat, class: 'cat-row' },
            h('span', { class: 'cat-name', style: `color:${color}` }, cat),
            h('div', { class: 'cat-bar-track' },
              h('div', { class: 'bar-fill', style: `width:${total / maxCat * 100}%;background:${color}` })
            ),
            h('span', { style: 'font-size:.78rem;color:var(--muted);min-width:20px;text-align:right' }, total),
            done > 0 && h('span', { class: 'cat-done' }, `✓${done}`)
          )
        )
      )
    )
  )
}

// ─── WeeklySummaryView ────────────────────────────────────────────
function WeeklySummaryView({ data, T, onClose, onGenerate, summaryText, loading }) {
  const tasks = data.tasks
  const now = new Date()
  const weekAgo = new Date(now)
  weekAgo.setDate(weekAgo.getDate() - 7)
  const weekAgoStr = weekAgo.toISOString().slice(0, 10)

  const doneTasks = tasks.filter(t => t.completedAt && t.completedAt.slice(0, 10) >= weekAgoStr)
  const cats = [...new Set(doneTasks.map(t => t.category))].length
  const highDone = doneTasks.filter(t => t.priority === 'high').length
  const remaining = tasks.filter(t => t.status === 'active').length

  return h('div', {
    class: 'stats-overlay',

// ─── JournalView ──────────────────────────────────────────────────
function JournalView({ journal, T, onClose, onSave }) {
  const today = new Date().toISOString().slice(0, 10)
  const todayEntry = journal[today] || { text: '', mood: '' }
  const [text, setText] = useState(todayEntry.text)
  const [mood, setMood] = useState(todayEntry.mood)
  const [expanded, setExpanded] = useState(new Set())
  const [saved, setSaved] = useState(false)
  const saveTimer = useRef(null)
  const MOODS = ['😄', '🙂', '😐', '😕', '😢']

  const doSave = useCallback((t, m) => {
    onSave(today, { text: t, mood: m, savedAt: new Date().toISOString() })
    setSaved(true)
    setTimeout(() => setSaved(false), 2000)
  }, [today, onSave])

  const handleText = e => {
    const val = e.target.value
    setText(val)
    clearTimeout(saveTimer.current)
    saveTimer.current = setTimeout(() => doSave(val, mood), 700)
  }

  const handleMood = m => {
    setMood(m)
    clearTimeout(saveTimer.current)
    doSave(text, m)
  }

  const pastDays = Array.from({ length: 6 }, (_, i) => {
    const d = new Date()
    d.setDate(d.getDate() - (i + 1))
    return d.toISOString().slice(0, 10)
  }).filter(d => journal[d] && journal[d].text)

  const toggleExpanded = d => setExpanded(prev => {
    const next = new Set(prev)
    next.has(d) ? next.delete(d) : next.add(d)
    return next
  })

  const fmtDay = d => new Date(d + 'T12:00:00').toLocaleDateString(T.locale, { month: 'numeric', day: 'numeric', weekday: 'short' })

  return h('div', {
    class: 'stats-overlay',
    onClick: e => { if (e.target === e.currentTarget) onClose() },
  },
    h('div', { class: 'stats-sheet' },
      h('div', { class: 'stats-header' },
        h('h2', { style: 'font-size:1.15rem;font-weight:700' }, T.journalTitle),
        h('button', { class: 'close-btn', onClick: onClose, style: 'font-size:1.2rem;padding:4px 8px' }, '✕')
      ),
      h('div', { class: 'journal-date-header' }, `${T.journalTodayLabel} · ${fmtDay(today)}`),
      h('div', { class: 'journal-mood-row' },
        h('span', { class: 'journal-mood-label' }, T.journalMoodLabel),
        MOODS.map(m => h('button', {
          key: m,
          class: `mood-btn${mood === m ? ' active' : ''}`,
          onClick: () => handleMood(m),
        }, m))
      ),
      h('textarea', {
        class: 'journal-textarea',
        placeholder: T.journalTextPlaceholder,
        value: text,
        onInput: handleText,
        autofocus: true,
      }),
      h('div', { class: 'journal-auto-save' }, saved ? T.journalSaved : ''),
      pastDays.length > 0
        ? h(Fragment, null,
            h('div', { class: 'journal-past-title' }, T.journalPastTitle),
            pastDays.map(d => {
              const entry = journal[d]
              const isOpen = expanded.has(d)
              return h('div', { key: d, class: 'journal-past-entry' },
                h('div', { class: 'journal-past-header', onClick: () => toggleExpanded(d) },
                  entry.mood && h('span', { class: 'journal-past-mood' }, entry.mood),
                  h('span', { class: 'journal-past-date' }, fmtDay(d)),
                  !isOpen && h('span', { class: 'journal-past-snippet' }, entry.text.slice(0, 50).replace(/\n/g, ' ')),
                  h('span', { class: 'journal-past-arrow' }, isOpen ? '▲' : '▼')
                ),
                isOpen && h('div', { class: 'journal-past-body' }, entry.text)
              )
            })
          )
        : text === '' && h('p', { class: 'journal-no-entries' }, T.journalNoEntries)
    )
  )
}

// ─── PomodoroView ─────────────────────────────────────────────────
const POMO_WORK = 25 * 60
const POMO_SHORT = 5 * 60
const POMO_LONG = 15 * 60

function PomodoroView({ data, T, onClose, timerState, onAction }) {
  const activeTasks = data.tasks.filter(t => t.status === 'active')
  const selectedTask = timerState.taskId ? data.tasks.find(t => t.id === timerState.taskId) : null

  const totalSecs = timerState.phase === 'short-break' ? POMO_SHORT
    : timerState.phase === 'long-break' ? POMO_LONG : POMO_WORK
  const progress = timerState.phase === 'idle' ? 0 : 1 - timerState.remaining / totalSecs

  const R = 68
  const CIRC = 2 * Math.PI * R
  const offset = CIRC * (1 - progress)

  const phaseColor = timerState.phase === 'work' ? '#ff3b30'
    : timerState.phase === 'short-break' ? '#34c759'
    : timerState.phase === 'long-break' ? '#30b0c7'
    : 'var(--muted)'

  const phaseLabel = timerState.phase === 'work' ? T.pomodoroWork
    : timerState.phase === 'short-break' ? T.pomodoroShortBreak
    : timerState.phase === 'long-break' ? T.pomodoroLongBreak
    : T.pomodoroIdle

  const mins = Math.floor(timerState.remaining / 60).toString().padStart(2, '0')
  const secs = (timerState.remaining % 60).toString().padStart(2, '0')
  const sessionDots = Array.from({ length: 4 }, (_, i) => (timerState.sessionCount % 4) > i)

  return h('div', {
    class: 'stats-overlay',
    onClick: e => { if (e.target === e.currentTarget) onClose() },
  },
    h('div', { class: 'stats-sheet' },
      h('div', { class: 'stats-header' },
        h('h2', { style: 'font-size:1.15rem;font-weight:700' }, T.pomodoroTitle),
        h('button', { class: 'close-btn', onClick: onClose, style: 'font-size:1.2rem;padding:4px 8px' }, '✕')
      ),
      activeTasks.length === 0
        ? h('p', { style: 'text-align:center;color:var(--muted);font-size:.88rem;padding:20px 0' }, T.pomodoroNoTasks)
        : h('select', {
            class: 'pomo-task-select',
            value: timerState.taskId || '',
            onChange: e => onAction('setTask', e.target.value),
            disabled: timerState.running,
          },
            h('option', { value: '' }, T.pomodoroSelectDefault),
            activeTasks.map(t => h('option', { key: t.id, value: t.id }, t.title))
          ),
      h('div', { class: 'pomo-ring-wrap' },
        h('svg', { class: 'pomo-ring', width: 160, height: 160, viewBox: '0 0 160 160' },
          h('circle', { cx: 80, cy: 80, r: R, style: 'fill:none;stroke:var(--border);stroke-width:9' }),
          timerState.phase !== 'idle' && h('circle', {
            cx: 80, cy: 80, r: R,
            style: `fill:none;stroke:${phaseColor};stroke-width:9;stroke-linecap:round;stroke-dasharray:${CIRC};stroke-dashoffset:${offset};transition:stroke-dashoffset .9s linear`,
          })
        ),
        h('div', { class: 'pomo-center' },
          h('div', { class: 'pomo-time', style: `color:${timerState.phase !== 'idle' ? phaseColor : 'var(--text)'}` }, `${mins}:${secs}`),
          h('div', { class: 'pomo-phase-label' }, phaseLabel)
        )
      ),
      h('div', { class: 'pomo-session-dots' },
        sessionDots.map((done, i) => h('div', { key: i, class: `pomo-dot${done ? ' done' : ''}` }))
      ),
      selectedTask && h('div', { class: 'pomo-task-pomos' },
        T.pomodoroSessions(selectedTask.pomodoroCount || 0)
      ),
      h('div', { class: 'pomo-controls' },
        timerState.phase === 'idle'
          ? h('button', {
              class: 'btn-primary', disabled: !timerState.taskId,
              onClick: () => onAction('start'),
            }, T.pomodoroStart)
          : h(Fragment, null,
              h('button', {
                class: 'btn-primary',
                onClick: () => onAction(timerState.running ? 'pause' : 'resume'),
              }, timerState.running ? T.pomodoroPause : T.pomodoroResume),
              h('button', { class: 'btn-secondary', onClick: () => onAction('skip') }, T.pomodoroSkip),
              h('button', { class: 'btn-ghost', onClick: () => onAction('reset') }, T.pomodoroReset)
            )
      )
    )
  )
}

// ─── App ──────────────────────────────────────────────────────────
function App() {
  const [data, setData] = useState(load)
  const [input, setInput] = useState('')
  const [query, setQuery] = useState('')
  const [queryResult, setQueryResult] = useState('')
  const [selectedCat, setSelectedCat] = useState(null)
  const [adding, setAdding] = useState(false)
  const [querying, setQuerying] = useState(false)
  const [loadingActions, setLoadingActions] = useState(null)
  const [apiKeyInput, setApiKeyInput] = useState('')
  const [showSettings, setShowSettings] = useState(false)
  const [error, setError] = useState('')
  const [editingId, setEditingId] = useState(null)
  const [editTitle, setEditTitle] = useState('')
  const [editOriginal, setEditOriginal] = useState('')
  const [editDueDate, setEditDueDate] = useState('')
  const [editRecurrence, setEditRecurrence] = useState('')
  const [searchText, setSearchText] = useState('')
  const [toast, setToast] = useState(null)
  const [showExportMenu, setShowExportMenu] = useState(false)
  const [expandedNotes, setExpandedNotes] = useState(new Set())
  const [notesPreviewMode, setNotesPreviewMode] = useState(new Set())
  const [batchMode, setBatchMode] = useState(false)
  const [selectedIds, setSelectedIds] = useState(new Set())
  const [showStats, setShowStats] = useState(false)
  const [showAddBoard, setShowAddBoard] = useState(false)
  const [newBoardName, setNewBoardName] = useState('')
  const [manageBoardId, setManageBoardId] = useState(null)
  const [manageBoardName, setManageBoardName] = useState('')
  const [notifPermission, setNotifPermission] = useState(() =>
    'Notification' in window ? Notification.permission : 'unsupported'
  )
  const toastTimer = useRef(null)
  const draggingIdRef = useRef(null)
  const timerRef = useRef(null)
  const pomodoroDataRef = useRef(null)
  const [draggingId, setDraggingId] = useState(null)
  const [dragOverId, setDragOverId] = useState(null)
  const [focusMode, setFocusMode] = useState(false)
  const [showWeeklySummary, setShowWeeklySummary] = useState(false)
  const [weeklySummaryText, setWeeklySummaryText] = useState('')
  const [weeklyLoading, setWeeklyLoading] = useState(false)
  const [showJournal, setShowJournal] = useState(false)
  const [showPomodoro, setShowPomodoro] = useState(false)
  const [timerState, setTimerState] = useState({ phase: 'idle', running: false, remaining: POMO_WORK, taskId: null, sessionCount: 0, pomoDone: null })

  const lang = data.lang || 'ja'
  const T = TRANSLATIONS[lang]

  useEffect(() => {
    if (timerState.running) {
      const m = Math.floor(timerState.remaining / 60).toString().padStart(2, '0')
      const s = (timerState.remaining % 60).toString().padStart(2, '0')
      document.title = `${m}:${s} — ${T.appTitle}`
    } else {
      document.title = T.appTitle
    }
    document.documentElement.lang = lang
  }, [lang, timerState.running, timerState.remaining])

  useEffect(() => { pomodoroDataRef.current = { data, persist } })

  useEffect(() => {
    if (!timerState.running) { clearInterval(timerRef.current); return }
    timerRef.current = setInterval(() => {
      setTimerState(prev => {
        if (!prev.running) return prev
        if (prev.remaining <= 1) {
          clearInterval(timerRef.current)
          playBeep(prev.phase === 'work' ? 880 : 660, 0.35)
          if (prev.phase === 'work') {
            const newSC = (prev.sessionCount || 0) + 1
            const isLong = newSC % 4 === 0
            return { ...prev, running: false, phase: isLong ? 'long-break' : 'short-break', remaining: isLong ? POMO_LONG : POMO_SHORT, sessionCount: newSC, pomoDone: prev.taskId }
          }
          return { ...prev, running: false, phase: 'idle', remaining: POMO_WORK, pomoDone: null }
        }
        return { ...prev, remaining: prev.remaining - 1 }
      })
    }, 1000)
    return () => clearInterval(timerRef.current)
  }, [timerState.running])

  useEffect(() => {
    if (!timerState.pomoDone) return
    const taskId = timerState.pomoDone
    if (pomodoroDataRef.current) {
      const { data: d, persist: p } = pomodoroDataRef.current
      p({ ...d, tasks: d.tasks.map(t => t.id === taskId ? { ...t, pomodoroCount: (t.pomodoroCount || 0) + 1 } : t) })
    }
    setTimerState(prev => ({ ...prev, pomoDone: null }))
  }, [timerState.pomoDone])

  const inputSpeech = useSpeech(text => setInput(prev => prev ? prev + ' ' + text : text), lang)
  const querySpeech = useSpeech(text => {
    setQuery(text)
    setTimeout(() => document.getElementById('qi')?.dispatchEvent(new CustomEvent('vs', {detail:text})), 100)
  }, lang)

  useEffect(() => {
    const d = load()
    if (d.apiKey) {
      setApiKeyInput(d.apiKey)
      if (!d.onboarded) {
        const updated = { ...d, onboarded: true }
        localStorage.setItem(KEY, JSON.stringify(updated))
        setData(updated)
      }
    } else if (d.onboarded) {
      setShowSettings(true)
    }
  }, [])

  useEffect(() => {
    const el = document.getElementById('qi')
    if (!el) return
    const handler = e => { if (e.detail && data.apiKey) handleQueryText(e.detail) }
    el.addEventListener('vs', handler)
    return () => el.removeEventListener('vs', handler)
  }, [data])

  useEffect(() => {
    if (!data.notificationsEnabled) return
    if (!('Notification' in window) || Notification.permission !== 'granted') return
    const run = () => checkAndNotify(data.tasks, T)
    run()
    const id = setInterval(run, 5 * 60 * 1000)
    return () => clearInterval(id)
  }, [data.notificationsEnabled, data.tasks, lang])

  const showToast = useCallback((message, onUndo) => {
    clearTimeout(toastTimer.current)
    setToast({ message, onUndo })
    toastTimer.current = setTimeout(() => setToast(null), 4000)
  }, [])

  const persist = useCallback(next => {
    if (next.activeBoardId && next.boardData) {
      next = { ...next, boardData: { ...next.boardData, [next.activeBoardId]: { tasks: next.tasks, categories: next.categories, taskOrder: next.taskOrder || [] } } }
    }
    setData(next)
    localStorage.setItem(KEY, JSON.stringify(next))
  }, [])

  const saveJournalEntry = useCallback((date, entry) => {
    const next = { ...data, journal: { ...(data.journal || {}), [date]: entry } }
    setData(next)
    localStorage.setItem(KEY, JSON.stringify(next))
  }, [data])

  const handleTimerAction = (action, payload) => {
    switch (action) {
      case 'start':
        setTimerState(prev => ({ ...prev, phase: 'work', running: true, remaining: POMO_WORK }))
        break
      case 'pause':
        setTimerState(prev => ({ ...prev, running: false }))
        break
      case 'resume':
        setTimerState(prev => ({ ...prev, running: true }))
        break
      case 'reset':
        clearInterval(timerRef.current)
        setTimerState(prev => ({ ...prev, phase: 'idle', running: false, remaining: POMO_WORK, pomoDone: null }))
        break
      case 'skip':
        clearInterval(timerRef.current)
        setTimerState(prev => {
          if (prev.phase === 'work') {
            const newSC = (prev.sessionCount || 0) + 1
            if (prev.taskId && pomodoroDataRef.current) {
              const { data: d, persist: p } = pomodoroDataRef.current
              p({ ...d, tasks: d.tasks.map(t => t.id === prev.taskId ? { ...t, pomodoroCount: (t.pomodoroCount || 0) + 1 } : t) })
            }
            const isLong = newSC % 4 === 0
            return { ...prev, running: false, phase: isLong ? 'long-break' : 'short-break', remaining: isLong ? POMO_LONG : POMO_SHORT, sessionCount: newSC }
          }
          return { ...prev, running: false, phase: 'idle', remaining: POMO_WORK }
        })
        break
      case 'setTask':
        setTimerState(prev => ({ ...prev, taskId: payload || null }))
        break
    }
  }

  const toggleLang = () => persist({ ...data, lang: lang === 'ja' ? 'en' : 'ja' })

  const switchBoard = id => {
    if (id === data.activeBoardId) return
    const updatedBoardData = { ...data.boardData, [data.activeBoardId]: { tasks: data.tasks, categories: data.categories, taskOrder: data.taskOrder || [] } }
    const bd = updatedBoardData[id] || { tasks: [], categories: [], taskOrder: [] }
    persist({ ...data, tasks: bd.tasks, categories: bd.categories, taskOrder: bd.taskOrder || [], activeBoardId: id, boardData: updatedBoardData })
    setSelectedCat(null); setSearchText(''); setFocusMode(false)
    setShowWeeklySummary(false); setWeeklySummaryText('')
  }

  const addBoard = () => {
    const name = newBoardName.trim()
    if (!name) return
    const id = `${Date.now()}-${Math.random().toString(36).slice(2)}`
    const updatedBoardData = { ...data.boardData, [data.activeBoardId]: { tasks: data.tasks, categories: data.categories, taskOrder: data.taskOrder || [] }, [id]: { tasks: [], categories: [], taskOrder: [] } }
    persist({ ...data, boards: [...data.boards, { id, name }], boardData: updatedBoardData, tasks: [], categories: [], taskOrder: [], activeBoardId: id })
    setNewBoardName(''); setShowAddBoard(false); setSelectedCat(null); setSearchText('')
  }

  const openManageBoard = board => {
    setManageBoardId(board.id)
    setManageBoardName(board.name)
  }

  const saveRenameBoard = () => {
    const name = manageBoardName.trim()
    if (!name || !manageBoardId) return
    persist({ ...data, boards: data.boards.map(b => b.id === manageBoardId ? { ...b, name } : b) })
    setManageBoardId(null)
  }

  const deleteBoard = id => {
    if (data.boards.length <= 1) return
    if (!confirm(T.deleteBoardConfirm)) return
    const newBoards = data.boards.filter(b => b.id !== id)
    const targetId = newBoards[0].id
    const newBoardData = { ...data.boardData }
    delete newBoardData[id]
    const bd = newBoardData[targetId] || { tasks: [], categories: [], taskOrder: [] }
    persist({ ...data, boards: newBoards, boardData: newBoardData, tasks: bd.tasks, categories: bd.categories, taskOrder: bd.taskOrder || [], activeBoardId: targetId })
    setManageBoardId(null); setSelectedCat(null); setSearchText('')
  }

  const saveApiKey = () => {
    const key = apiKeyInput.trim()
    if (!key) return
    persist({ ...data, apiKey: key, onboarded: true })
    setShowSettings(false); setError('')
  }

  const handleOnboardingStart = () => {
    persist({ ...data, onboarded: true })
    setShowSettings(true)
  }

  const handleOnboardingSkip = () => {
    persist({ ...data, onboarded: true })
  }

  const handleOnboardingLang = () => {
    persist({ ...data, lang: lang === 'ja' ? 'en' : 'ja' })
  }

  const handleAdd = async () => {
    if (!input.trim() || adding) return
    if (!data.apiKey) { setShowSettings(true); return }
    setAdding(true); setError('')
    try {
      const { title, category } = await categorizeTask(data.apiKey, input.trim(), data.categories, lang)
      const task = {
        id: `${Date.now()}-${Math.random().toString(36).slice(2)}`,
        originalText: input.trim(), title, category,
        nextActions: [], createdAt: new Date().toISOString(), status: 'active', priority: 'medium',
      }
      const cats = data.categories.includes(category) ? data.categories : [...data.categories, category]
      const newTaskOrder = [task.id, ...(data.taskOrder || [])]
      persist({ ...data, tasks: [task, ...data.tasks], categories: cats, taskOrder: newTaskOrder })
      setInput('')
    } catch (e) { setError(e.message || T.errorDefault) }
    finally { setAdding(false) }
  }

  const handleQueryText = async q => {
    if (!q.trim() || querying) return
    setQuerying(true); setQueryResult(''); setError('')
    try { setQueryResult(await queryTasks(data.apiKey, q.trim(), data.tasks, lang)) }
    catch (e) { setError(e.message || T.errorDefault) }
    finally { setQuerying(false) }
  }

  const handleQuery = () => handleQueryText(query)

  const handleGenerateWeeklySummary = async () => {
    if (!data.apiKey) { setShowSettings(true); return }
    setWeeklyLoading(true); setWeeklySummaryText('')
    try { setWeeklySummaryText(await generateWeeklySummary(data.apiKey, data.tasks, lang)) }
    catch (e) { setWeeklySummaryText(T.weeklyError) }
    finally { setWeeklyLoading(false) }
  }

  const handleSuggest = async taskId => {
    const task = data.tasks.find(t => t.id === taskId)
    if (!task) return
    setLoadingActions(taskId); setError('')
    try {
      const nextActions = await getNextActions(data.apiKey, task, lang)
      persist({ ...data, tasks: data.tasks.map(t => t.id === taskId ? {...t, nextActions} : t) })
    } catch (e) { setError(e.message || T.errorDefault) }
    finally { setLoadingActions(null) }
  }

  const toggleDone = id => {
    const task = data.tasks.find(t => t.id === id)
    if (!task) return
    if (task.recurrence && task.status === 'active') {
      const today = new Date().toISOString().slice(0, 10)
      const base = task.dueDate && task.dueDate >= today ? task.dueDate : today
      const bd = new Date(base + 'T12:00:00')
      if (task.recurrence === 'daily') bd.setDate(bd.getDate() + 1)
      else bd.setDate(bd.getDate() + 7)
      const nextDue = bd.toISOString().slice(0, 10)
      persist({ ...data, tasks: data.tasks.map(t => t.id === id
        ? { ...t, status: 'active', completedAt: new Date().toISOString(), dueDate: nextDue }
        : t) })
      showToast(T.recurCompleted(nextDue), null)
      return
    }
    persist({
      ...data,
      tasks: data.tasks.map(t => t.id === id
        ? { ...t, status: t.status === 'done' ? 'active' : 'done',
            completedAt: t.status === 'done' ? null : new Date().toISOString() }

    })
  }

  const deleteTask = id => {
    const task = data.tasks.find(t => t.id === id)
    const next = { ...data, tasks: data.tasks.filter(t => t.id !== id), taskOrder: (data.taskOrder || []).filter(tid => tid !== id) }
    persist(next)
    showToast(T.taskDeleted, () => {
      persist({ ...next, tasks: [task, ...next.tasks], taskOrder: [task.id, ...(next.taskOrder || [])] })
      setToast(null)
    })
  }

  const startEdit = task => {
    setEditingId(task.id)
    setEditTitle(task.title)
    setEditOriginal(task.originalText)
    setEditDueDate(task.dueDate || '')
    setEditRecurrence(task.recurrence || '')
  }

  const saveEdit = () => {
    if (!editTitle.trim()) return
    persist({
      ...data,
      tasks: data.tasks.map(t => t.id === editingId
        ? {...t, title: editTitle.trim(), originalText: editOriginal.trim() || t.originalText,
           dueDate: editDueDate || null, recurrence: editRecurrence || null}
        : t)
    })
    setEditingId(null)
  }

  const cancelEdit = () => setEditingId(null)

  const shareTask = task => {
    const lines = [`📌 ${task.title}`]
    lines.push(`${T.shareFieldCategory}: ${task.category}`)
    lines.push(`${T.shareFieldPriority}: ${T.priority[task.priority || 'medium']}`)
    if (task.dueDate) lines.push(`${T.shareFieldDue}: ${task.dueDate}`)
    if (task.recurrence) lines.push(`${T.shareFieldRecur}: ${T.recurBadge(task.recurrence)}`)
    lines.push(`${T.shareFieldStatus}: ${T.shareStatus[task.status]}`)
    if (task.notes && task.notes.trim()) lines.push(`\n${T.shareFieldNotes}:\n${task.notes.trim()}`)
    if (task.originalText && task.originalText.trim()) lines.push(`\n${task.originalText.trim()}`)
    const text = lines.join('\n')
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(() => showToast(T.shareCopied, null))
        .catch(() => {
          const ta = document.createElement('textarea')
          ta.value = text; document.body.appendChild(ta); ta.select()
          document.execCommand('copy'); document.body.removeChild(ta)
          showToast(T.shareCopied, null)
        })
    } else {
      const ta = document.createElement('textarea')
      ta.value = text; document.body.appendChild(ta); ta.select()
      document.execCommand('copy'); document.body.removeChild(ta)
      showToast(T.shareCopied, null)
    }
  }

  const toggleNotes = id => setExpandedNotes(prev => {
    const next = new Set(prev)
    next.has(id) ? next.delete(id) : next.add(id)
    return next
  })

  const toggleNotesPreview = (id, on) => setNotesPreviewMode(prev => {
    const next = new Set(prev)
    on ? next.add(id) : next.delete(id)
    return next
  })

  const saveNote = (id, text) => persist({
    ...data,
    tasks: data.tasks.map(t => t.id === id ? {...t, notes: text} : t)
  })

  const togglePriority = id => persist({
    ...data,
    tasks: data.tasks.map(t => t.id === id ? {...t, priority: cyclePriority(t.priority || 'medium')} : t)
  })

  const toggleBatchMode = () => { setBatchMode(m => !m); setSelectedIds(new Set()) }

  const handleDragStart = (e, taskId) => {
    draggingIdRef.current = taskId
    setDraggingId(taskId)
    e.dataTransfer.effectAllowed = 'move'
    e.dataTransfer.setData('text/plain', taskId)
  }

  const handleDragOver = (e, taskId) => {
    e.preventDefault()
    const rect = e.currentTarget.getBoundingClientRect()
    const pos = e.clientY < rect.top + rect.height / 2 ? 'before' : 'after'
    const newId = `${taskId}:${pos}`
    if (dragOverId !== newId) setDragOverId(newId)
  }

  const handleDrop = (e, targetId) => {
    e.preventDefault()
    const dragId = draggingIdRef.current
    if (!dragId || dragId === targetId) {
      draggingIdRef.current = null; setDraggingId(null); setDragOverId(null); return
    }
    const rect = e.currentTarget.getBoundingClientRect()
    const pos = e.clientY < rect.top + rect.height / 2 ? 'before' : 'after'
    const allIds = data.tasks.map(t => t.id)
    const baseOrder = (data.taskOrder || []).length > 0 ? data.taskOrder : allIds
    const withoutDragged = baseOrder.filter(id => id !== dragId)
    const targetIdx = withoutDragged.indexOf(targetId)
    if (targetIdx === -1) { draggingIdRef.current = null; setDraggingId(null); setDragOverId(null); return }
    const insertIdx = pos === 'before' ? targetIdx : targetIdx + 1
    const newOrder = [...withoutDragged.slice(0, insertIdx), dragId, ...withoutDragged.slice(insertIdx)]
    persist({ ...data, taskOrder: newOrder })
    draggingIdRef.current = null; setDraggingId(null); setDragOverId(null)
  }

  const handleDragEnd = () => {
    draggingIdRef.current = null; setDraggingId(null); setDragOverId(null)
  }

  const requestNotifPermission = async () => {
    if (!('Notification' in window)) return
    const perm = await Notification.requestPermission()
    setNotifPermission(perm)
    if (perm === 'granted') persist({ ...data, notificationsEnabled: true })
  }

  const toggleNotifications = () => {
    if (data.notificationsEnabled) {
      persist({ ...data, notificationsEnabled: false })
    } else {
      if (notifPermission === 'granted') {
        persist({ ...data, notificationsEnabled: true })
      } else {
        requestNotifPermission()
      }
    }
  }

  const toggleSelectTask = id => setSelectedIds(prev => {
    const next = new Set(prev)
    next.has(id) ? next.delete(id) : next.add(id)
    return next
  })

  const batchSelectAll = () => setSelectedIds(new Set(focusShown.map(t => t.id)))

  const batchComplete = () => {
    persist({ ...data, tasks: data.tasks.map(t => selectedIds.has(t.id) ? {...t, status: 'done'} : t) })
    setBatchMode(false); setSelectedIds(new Set())
  }

  const batchDelete = () => {
    const toDelete = data.tasks.filter(t => selectedIds.has(t.id))
    const next = { ...data, tasks: data.tasks.filter(t => !selectedIds.has(t.id)), taskOrder: (data.taskOrder || []).filter(id => !selectedIds.has(id)) }
    persist(next); setBatchMode(false); setSelectedIds(new Set())
    showToast(T.taskDeleted, () => { persist({ ...next, tasks: [...toDelete, ...next.tasks], taskOrder: [...toDelete.map(t => t.id), ...(next.taskOrder || [])] }); setToast(null) })

  const exportJSON = () => {

    a.href = url; a.download = `brain-dump-${new Date().toISOString().slice(0, 10)}.json`
    a.click(); URL.revokeObjectURL(url)
    setShowExportMenu(false)
  }

  const exportTextFile = () => {
    const ac = data.tasks.filter(t => t.status === 'active').length
    const dc = data.tasks.filter(t => t.status === 'done').length
    const dateStr = new Date().toLocaleDateString(T.locale)
    const lines = [T.exportHeader(dateStr), T.exportSummary(data.tasks.length, ac, dc), '']
    const groups = {}
    data.tasks.forEach(t => { (groups[t.category] = groups[t.category] || []).push(t) })
    Object.entries(groups).forEach(([cat, tasks]) => {
      lines.push(`## ${cat}`)
      tasks.forEach(t => {
        const st = t.status === 'done' ? T.exportStatusDone : T.exportStatusActive
        const pr = T.exportPriority[t.priority || 'medium']
        const due = t.dueDate ? ` ${T.exportDuePrefix}:${t.dueDate}` : ''
        lines.push(`${st} ${pr} ${t.title}${due}`)
        if (t.originalText !== t.title) lines.push(`    ${t.originalText}`)
        t.nextActions.forEach((a, i) => lines.push(`    ${i + 1}. ${a}`))
      })
      lines.push('')
    })
    const blob = new Blob([lines.join('\n')], { type: 'text/plain;charset=utf-8' })
    const url = URL.createObjectURL(blob)
    const a = document.createElement('a')
    a.href = url; a.download = `brain-dump-${new Date().toISOString().slice(0, 10)}.txt`
    a.click(); URL.revokeObjectURL(url)
    setShowExportMenu(false)
  }

  const search = searchText.trim().toLowerCase()
  const rawFiltered = data.tasks
    .filter(t => !selectedCat || t.category === selectedCat)
    .filter(t => !search ||
      t.title.toLowerCase().includes(search) ||
      t.originalText.toLowerCase().includes(search) ||
      t.category.toLowerCase().includes(search))
  const taskOrder = data.taskOrder || []
  const orderMap = new Map(taskOrder.map((id, i) => [id, i]))
  const filtered = [...rawFiltered].sort((a, b) => {
    if (a.status !== b.status) return a.status === 'done' ? 1 : -1
    if (taskOrder.length > 0) {
      const ai = orderMap.has(a.id) ? orderMap.get(a.id) : Infinity
      const bi = orderMap.has(b.id) ? orderMap.get(b.id) : Infinity
      return ai - bi
    }
    return (PRIORITY_ORDER[a.priority || 'medium']) - (PRIORITY_ORDER[b.priority || 'medium'])
  })
  const activeCount = data.tasks.filter(t => t.status === 'active').length
  const doneCount = data.tasks.filter(t => t.status === 'done').length
  const focusActive = focusMode ? filtered.filter(t => t.status === 'active') : null

            : T.pomodoroBtn),

        )

          return h('button', {

            class: `board-chip${isActive ? ' active' : ''}`,

            notifPermission === 'granted' && data.notificationsEnabled && h('div', { class: 'notif-status notif-ok' }, T.notifGranted),

        querySpeech.supported && h('button', {
          class: `mic-btn-inline ${querySpeech.listening ? 'recording' : ''}`,
          onClick: querySpeech.toggle,

        h('button', { class: 'btn-secondary', onClick: handleQuery, disabled: querying || !query.trim() },
          querying ? '...' : T.queryBtn)
      ),

      queryResult && h('div', { class: 'query-result' },
        h('div', { class: 'qr-header' },

          h('button', { class: 'close-btn', onClick: () => setQueryResult('') }, '✕')
        ),
        h('div', { class: 'qr-body' }, queryResult.split('\n').map((line, i) => h('p', { key: i }, line)))
      ),

                  }),

                      onInput: e => setEditDueDate(e.target.value),
                    }),
                    editDueDate && h('button', { class: 'btn-clear-date', onClick: () => setEditDueDate(''), title: T.clearDueDate }, T.clearDueDate)
                  ),
                  h('div', { class: 'edit-recur-row' },
                    h('span', { class: 'edit-recur-label' }, T.recurLabel),
                    h('select', {
                      class: 'edit-recur-select', value: editRecurrence,
                      onChange: e => setEditRecurrence(e.target.value),
                    },
                      h('option', { value: '' }, T.recurNone),
                      h('option', { value: 'daily' }, T.recurDaily),
                      h('option', { value: 'weekly' }, T.recurWeekly)
                    )
                  ),
                  h('div', { class: 'edit-actions' },
                    h('button', { class: 'btn-save', onClick: saveEdit }, T.save),
                    h('button', { class: 'btn-cancel', onClick: cancelEdit }, T.cancel)
                  )
                )
              : h(Fragment, null,
                  h('h3', { class: 'task-title' }, task.title),
                  h('p', { class: 'task-original' }, task.originalText)
                ),

            !isEditing && expandedNotes.has(task.id) && h('div', { class: 'notes-section' },
              h('div', { class: 'notes-mode-toggle' },
                h('button', {
                  class: `notes-mode-btn ${!notesPreviewMode.has(task.id) ? 'active' : ''}`,
                  onClick: () => toggleNotesPreview(task.id, false),
                }, T.notesEditMode),
                h('button', {
                  class: `notes-mode-btn ${notesPreviewMode.has(task.id) ? 'active' : ''}`,
                  onClick: () => toggleNotesPreview(task.id, true),
                }, T.notesPreviewMode),
              ),
              notesPreviewMode.has(task.id)
                ? h('div', {
                    class: 'notes-preview',
                    dangerouslySetInnerHTML: {
                      __html: task.notes
                        ? marked.parse(task.notes)
                        : `<span class="notes-preview-empty">${T.notesEmpty}</span>`
                    }
                  })
                : h('textarea', {
                    class: 'notes-textarea',
                    placeholder: T.notesPlaceholder,
                    value: task.notes || '',
                    onInput: e => saveNote(task.id, e.target.value),
                  })
            ),

            task.nextActions.length > 0 && h('div', { class: 'actions-box', style: `border-left-color:${color}` },
              h('p', { class: 'actions-label', style: `color:${color}` }, T.nextActionsLabel),
              h('ol', { class: 'actions-list' }, task.nextActions.map((a, i) => h('li', { key: i }, a)))
            ),
            task.status !== 'done' && !isEditing && !batchMode && h('button', {
              class: 'suggest-btn', disabled: loadingActions === task.id,
              onClick: () => handleSuggest(task.id),
            }, loadingActions === task.id
              ? h(Fragment, null, h('span', { class: 'spin' }), ' ', T.thinking)
              : T.suggestBtn)
          )
        })
      )
    ),

    showStats && h(StatsView, { data, T, onClose: () => setShowStats(false) }),

    showWeeklySummary && h(WeeklySummaryView, {
      data, T,
      onClose: () => setShowWeeklySummary(false),
      onGenerate: handleGenerateWeeklySummary,
      summaryText: weeklySummaryText,
      loading: weeklyLoading,
    }),

    showJournal && h(JournalView, {
      journal: data.journal || {},
      T,
      onClose: () => setShowJournal(false),
      onSave: saveJournalEntry,
    }),

    showPomodoro && h(PomodoroView, {
      data,
      T,
      onClose: () => setShowPomodoro(false),
      timerState,
      onAction: handleTimerAction,
    }),

    showAddBoard && h('div', { class: 'board-modal-overlay', onClick: e => { if (e.target === e.currentTarget) setShowAddBoard(false) } },
      h('div', { class: 'board-modal' },
        h('h3', null, T.addBoardTitle),
        h('input', {
          class: 'board-modal-input', autofocus: true,
          placeholder: T.boardNamePlaceholder,
          value: newBoardName,
          onInput: e => setNewBoardName(e.target.value),
          onKeyDown: e => { if (e.key === 'Enter') addBoard(); if (e.key === 'Escape') setShowAddBoard(false) },
        }),
        h('div', { class: 'board-modal-btns' },
          h('button', { class: 'btn-ghost', onClick: () => setShowAddBoard(false) }, T.cancel),
          h('button', { class: 'btn-primary', onClick: addBoard, disabled: !newBoardName.trim() }, T.addBoardBtn)
        )
      )
    ),

    manageBoardId && h('div', { class: 'board-modal-overlay', onClick: e => { if (e.target === e.currentTarget) setManageBoardId(null) } },
      h('div', { class: 'board-modal' },
        h('h3', null, T.manageBoardTitle),
        h('input', {
          class: 'board-modal-input', autofocus: true,
          placeholder: T.boardNamePlaceholder,
          value: manageBoardName,
          onInput: e => setManageBoardName(e.target.value),
          onKeyDown: e => { if (e.key === 'Enter') saveRenameBoard(); if (e.key === 'Escape') setManageBoardId(null) },
        }),
        h('div', { class: 'board-modal-btns' },
          data.boards.length > 1 && h('button', { class: 'board-modal-del', onClick: () => deleteBoard(manageBoardId) }, T.deleteBoardBtn),
          h('button', { class: 'btn-ghost', onClick: () => setManageBoardId(null) }, T.cancel),
          h('button', { class: 'btn-primary', onClick: saveRenameBoard, disabled: !manageBoardName.trim() }, T.renameBtn)
        )
      )
    ),

    // Toast
    toast && h('div', { class: 'toast' },
      h('span', null, toast.message),
      toast.onUndo && h('button', { class: 'toast-undo', onClick: () => { toast.onUndo(); clearTimeout(toastTimer.current) } }, T.undoBtn)
    ),

    // Batch action bar
    batchMode && h('div', { class: 'batch-bar' },
      h('span', { class: 'batch-count' }, T.batchSelected(selectedIds.size)),
      h('button', { class: 'btn-ghost', onClick: batchSelectAll }, T.batchSelectAll),
      h('button', { class: 'btn-primary', disabled: selectedIds.size === 0, onClick: batchComplete },
        T.batchComplete(selectedIds.size)),
      h('button', { class: 'btn-ghost danger', disabled: selectedIds.size === 0, onClick: batchDelete },
        T.batchDelete(selectedIds.size))
    )
  )
}

render(h(App, null), document.getElementById('app'))
</script>
</body>
</html>
